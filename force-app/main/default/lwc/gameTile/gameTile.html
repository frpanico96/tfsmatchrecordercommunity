<template>
    <template lwc:if={isTile}>
        <lightning-card title={gameObj.gameName}></lightning-card>
    </template>
    <template lwc:elseif={isBtn}>
        <div class="slds-align_absolute-center">
            <lightning-button disabled={btnDisabled} style="width: 300px" stretch variant="neutral" label={gameObj.gameName} value={gameObj.gameId} onclick={handleClick}></lightning-button>
        </div>
    </template>
</template>
