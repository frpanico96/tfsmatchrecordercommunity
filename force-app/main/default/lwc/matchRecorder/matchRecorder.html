<template>
    <template lwc:if={loading}>
        <lightning-layout horizontal-align="center" vertical-align="center">
            <lightning-spinner variant="brand" size="medium"></lightning-spinner>
        </lightning-layout>
    </template>
    <template lwc:else>
        <template lwc:if={isMatchPickerPhase}>
            <c-match-picker onmatchpicked={advanceToPickBanPhase}></c-match-picker>
        </template>
        <template lwc:elseif={isPickBanPhase}>
            <c-pick-ban-phase match-obj={matchObj}></c-pick-ban-phase>
        </template>
    </template>
</template>
